<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>
<body>
    <h1>Register</h1><br>
    {% if error %}
        {{ error }}
    {% endif %}
    <form method="post">
        {% csrf_token %}
        <h1>username</h1>
        <input type="text" name="nom"><br>
        
        
        <h1>password</h1>
        <input type="password" name="parol"><br>

        <h1>email</h1>
        <input type="email" name="email"><br>
        
        
        <button type="submit">Register</button>
    </form><br>
    <a href="{% url 'login' %}">Login</a>
</body>
</html>
